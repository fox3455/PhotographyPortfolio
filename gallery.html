<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<body>

<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="brand">Caramon "Fox" Photography</a>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="about.html">About &amp; Contact</a></li>
    </ul>
  </nav>

<main>
  <div class="page-header container">
    <span class="eyebrow">Full Portfolio</span>
    <h1>Gallery</h1>
    <p>Browse by event, or view everything at once.</p>
  </div>

  <div class="container">
    <div class="filters" data-filters>
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="hcs">Halo Championship Series</button>
      <button class="filter-btn" data-filter="comiccon">Comic-Con</button>
      <button class="filter-btn" data-filter="dreamhack">DreamHack</button>

    <div class="gallery-grid" data-gallery-grid></div>

<div class="lightbox" data-lightbox>
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <img src="" alt="">
  <div class="lightbox-caption"></div>
</div>

<footer class="site-footer">
  <div class="container">
    &copy; <span id="year"></span> Caramon "Fox" Photography · <a href="about.html">Contact</a>

<script src="js/data.js"></script>
