<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="brand">Caramon "Fox" Photography<span>.</span></a>

      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>

    </ul>
  </nav>
</header>

<main>
  <div class="page-header container">
    <span class="eyebrow">Full Portfolio</span>
    <h1>Gallery</h1>
    <p>Browse by event, or view everything at once.</p>
  </div>

  <div class="container">
    <div class="filters" data-filters></div>

  <figure class="lightbox-figure">

      <div class="cap-title"></div>
      <div class="cap-sub"></div>
    </figcaption>
    <div data-lightbox-exif></div>
  </figure>
</div>

<footer class="site-footer">
  <div class="container">
